openapi: 3.0.0

info:
  title: Derleng API
  version: 1.0.0
  description: Backend API for Derleng platform

servers:
  - url: http://localhost:5000/api
  - url: https://derleng-web-application-platform.onrender.com/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
      responses:
        '200':
          description: Login success

  /auth/register:
    post:
      summary: Verify code and register
      responses:
        '201':
          description: Registered

  /products:
    get:
      summary: Get all products
      responses:
        '200':
          description: Success

    post:
      summary: Create product
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product created

  /products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

    put:
      summary: Update product
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated

    delete:
      summary: Delete product
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted

  /posts:
    get:
      summary: Get all posts
      responses:
        '200':
          description: Success

    post:
      summary: Create post
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created

  /orders:
    post:
      summary: Place order
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created

  /bookings:
    post:
      summary: Create booking
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Booking created

    get:
      summary: Admin get all bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success

  /notifications:
    get:
      summary: Get user notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success